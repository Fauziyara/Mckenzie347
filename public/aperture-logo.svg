<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Aperture Orbit — Final Refined Version
       Filosofi: Aperture = pusat ekosistem Arc.
       Orbit = pairs berputar mengelilingi scanner engine.
       Interconnected, dinamis. -->
  <defs>
    <linearGradient id="aperture-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Orbit 1 — horizontal -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#aperture-grad)" stroke-width="1.5" opacity="0.3"/>
  <!-- Orbit 2 — 60deg -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#aperture-grad)" stroke-width="1.5" opacity="0.4" transform="rotate(60 32 32)"/>
  <!-- Orbit 3 — -60deg -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#aperture-grad)" stroke-width="1.5" opacity="0.3" transform="rotate(-60 32 32)"/>
  <!-- Pair nodes on orbits -->
  <circle cx="58" cy="32" r="2.5" fill="url(#aperture-grad)"/>
  <circle cx="6" cy="32" r="1.5" fill="url(#aperture-grad)" opacity="0.5"/>
  <circle cx="45" cy="9.5" r="2" fill="url(#aperture-grad)" opacity="0.8"/>
  <circle cx="19" cy="54.5" r="1.5" fill="url(#aperture-grad)" opacity="0.5"/>
  <circle cx="19" cy="9.5" r="2" fill="url(#aperture-grad)" opacity="0.8"/>
  <circle cx="45" cy="54.5" r="1.5" fill="url(#aperture-grad)" opacity="0.5"/>
  <!-- Core — aperture scanner engine -->
  <circle cx="32" cy="32" r="10" fill="url(#aperture-grad)" opacity="0.12"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="url(#aperture-grad)" stroke-width="2"/>
  <!-- Inner diamond (aperture blade) -->
  <path d="M32 25 L39 32 L32 39 L25 32 Z" fill="url(#aperture-grad)" opacity="0.5"/>
  <!-- Center pupil -->
  <circle cx="32" cy="32" r="3" fill="url(#aperture-grad)"/>
  <circle cx="32" cy="32" r="1.2" fill="#0a0a0a"/>
</svg>