<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Aperture Orbit — with emerald background
       Filosofi: Aperture = pusat ekosistem Arc.
       Orbit = pairs berputar mengelilingi scanner engine. -->
  <defs>
    <linearGradient id="aperture-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Emerald background — rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#aperture-bg)"/>
  <!-- Orbit 1 — horizontal -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#0a0a0a" stroke-width="1.5" opacity="0.2"/>
  <!-- Orbit 2 — 60deg -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#0a0a0a" stroke-width="1.5" opacity="0.25" transform="rotate(60 32 32)"/>
  <!-- Orbit 3 — -60deg -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#0a0a0a" stroke-width="1.5" opacity="0.2" transform="rotate(-60 32 32)"/>
  <!-- Pair nodes on orbits — dark on green -->
  <circle cx="56" cy="32" r="2.5" fill="#0a0a0a" opacity="0.7"/>
  <circle cx="8" cy="32" r="1.5" fill="#0a0a0a" opacity="0.4"/>
  <circle cx="44" cy="11" r="2" fill="#0a0a0a" opacity="0.6"/>
  <circle cx="20" cy="53" r="1.5" fill="#0a0a0a" opacity="0.4"/>
  <circle cx="20" cy="11" r="2" fill="#0a0a0a" opacity="0.6"/>
  <circle cx="44" cy="53" r="1.5" fill="#0a0a0a" opacity="0.4"/>
  <!-- Core — aperture scanner engine -->
  <circle cx="32" cy="32" r="10" fill="#0a0a0a" opacity="0.15"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Inner diamond (aperture blade) -->
  <path d="M32 25 L39 32 L32 39 L25 32 Z" fill="#0a0a0a" opacity="0.4"/>
  <!-- Center pupil -->
  <circle cx="32" cy="32" r="3" fill="#0a0a0a"/>
  <circle cx="32" cy="32" r="1.2" fill="url(#aperture-bg)"/>
</svg>